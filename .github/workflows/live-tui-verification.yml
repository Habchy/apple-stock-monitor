name: Live Mac TUI Verification

# Temporary verification branch only. This is not an unattended cloud stock bot.
# No webhook secret is loaded and no notification is sent by this workflow.
'on':
  push:
    branches: ['verify/live-mac-tui']
    paths: ['.github/workflows/live-tui-verification.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the unmodified TUI
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Observe two real automatic checks in a terminal
        run: |
          # Run the real app in a pseudo-terminal. A passive Python profiler records
          # returned Outcome objects; it replaces no function, data, clock, or network.
          # The supported --interval 60 option shortens this test only. The app's
          # default remains 300 seconds, and there are no refresh keypresses.
          python3 -u - <<'PY'
          import fcntl
          import json
          import os
          from pathlib import Path
          import pty
          import select
          import struct
          import subprocess
          import sys
          import tempfile
          import termios
          import time

          child_code = r'''
          import json
          import sys
          import threading
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          import tui

          evidence = Path(sys.argv[2])

          def observe(frame, event, result):
              """Record the real worker's return value without changing its behavior."""
              if event != 'return' or frame.f_code is not tui.perform_check.__code__:
                  return
              if not isinstance(result, tui.Outcome):
                  return
              finished = time.monotonic()
              record = {
                  'observed_utc': datetime.now(timezone.utc).isoformat(),
                  'started_monotonic': finished - result.duration,
                  'duration_seconds': result.duration,
                  'error': result.error,
                  'delivery_error': result.delivery_error,
                  'manual': result.manual,
                  'discord_receipt': result.receipt,
                  'cells_checked': len(result.observations or {}),
                  'candidates': result.candidates,
                  'confirmed': result.confirmed,
                  'http_log': result.log,
                  'inventory': [
                      {'sku': row['sku'], 'store': row['store_id'],
                       'status': row['status'], 'pickup': row['pickup']}
                      for row in (result.observations or {}).values()
                  ],
              }
              with evidence.open('a', encoding='utf-8') as output:
                  output.write(json.dumps(record) + '\n')
                  output.flush()

          # Only observe worker threads. The timer, curses, and Apple methods are
          # the exact production functions from the checked-out application.
          threading.setprofile(observe)
          raise SystemExit(tui.main([
              '--no-discord', '--no-keep-awake', '--interval', '60',
              '--data-dir', sys.argv[1],
          ]))
          '''
          # Remove YAML indentation from the executable child module.
          import textwrap
          child_code = textwrap.dedent(child_code)
          master, slave = pty.openpty()
          child = None
          terminal = bytearray()

          def drain():
              """Keep the terminal output buffer empty so it cannot block the real UI."""
              if select.select([master], [], [], 0.2)[0]:
                  try:
                      terminal.extend(os.read(master, 65536))
                  except OSError:
                      pass

          try:
              with tempfile.TemporaryDirectory() as directory:
                  evidence = Path(directory) / 'observed.jsonl'
                  fcntl.ioctl(slave, termios.TIOCSWINSZ,
                              struct.pack('HHHH', 34, 104, 0, 0))
                  environment = {**os.environ, 'TERM': 'xterm-256color', 'PYTHONUNBUFFERED': '1'}
                  environment.pop('DISCORD_WEBHOOK_URL', None)
                  child = subprocess.Popen(
                      [sys.executable, '-c', child_code, directory, str(evidence)],
                      stdin=slave, stdout=slave, stderr=slave, env=environment,
                  )
                  rows = []
                  deadline = time.monotonic() + 160
                  while time.monotonic() < deadline and child.poll() is None:
                      drain()
                      if evidence.exists():
                          try:
                              rows = [json.loads(line) for line in evidence.read_text().splitlines()]
                          except json.JSONDecodeError:
                              continue  # The worker may still be completing its last line.
                      if len(rows) >= 2:
                          break
                  # Quitting happens only after two results, never to trigger a poll.
                  if child.poll() is None:
                      os.write(master, b'q')
                      end = time.monotonic() + 20
                      while child.poll() is None and time.monotonic() < end:
                          drain()
                  exit_code = child.poll()
                  print('PRODUCTION_CODE_REF: 519858afdbac3a570dbf4bc0ceecd140965c2973')
                  print('PLATFORM:', sys.platform, 'PYTHON:', sys.version.split()[0])
                  print('NETWORK: real Apple HTTPS requests; no mocks or saved fixtures')
                  for number, row in enumerate(rows, 1):
                      print('LIVE_RESULT', number, json.dumps(row, ensure_ascii=True))
                  if exit_code != 0:
                      print('TERMINAL_TAIL:', repr(terminal[-2000:].decode(errors='replace')))
                  assert exit_code == 0, 'Actual terminal app did not exit successfully'
                  assert len(rows) >= 2, 'Two automatic checks were not observed'
                  assert all(row['error'] is None for row in rows[:2]), 'At least one live inventory check failed'
                  assert all(row['cells_checked'] == 20 for row in rows[:2]), 'Inventory coverage was incomplete'
                  assert all(row['manual'] is False for row in rows[:2]), 'A check was not automatic'
                  assert all(row['discord_receipt'] is None for row in rows), 'Verification must not send messages'
                  gap = rows[1]['started_monotonic'] - rows[0]['started_monotonic']
                  assert 59 <= gap <= 80, f'Unexpected automatic start interval: {gap}'
                  text = terminal.decode(errors='replace')
                  assert 'APPLE STOCK' in text and 'Sherman Oaks' in text, 'Dashboard did not render'
                  assert 'Traceback' not in text, 'Terminal session raised an exception'
                  print(f'PASS: two live automatic Apple checks; all 20 cells each; starts {gap:.2f}s apart; real curses UI; clean quit; no Discord posts')
                  summary = os.environ.get('GITHUB_STEP_SUMMARY')
                  if summary:
                      with open(summary, 'a', encoding='utf-8') as output:
                          output.write('## Real Mac TUI verification\n\n')
                          output.write(f'Two automatic real Apple checks, **{gap:.2f} seconds apart**, using the existing `--interval 60` option. Default remains 300 seconds. No mocks, no refresh keypresses, no Discord messages.\n\n')
                          for number, row in enumerate(rows[:2], 1):
                              output.write(f"Check {number}: {row['observed_utc']}; {row['cells_checked']}/20 cells; {row['candidates']} candidates; {len(row['confirmed'])} confirmed.\n\n")
          finally:
              if child is not None and child.poll() is None:
                  child.kill()
                  child.wait()
              os.close(master)
              os.close(slave)
          PY
