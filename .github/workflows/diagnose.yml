name: Monitor Diagnostics

# Temporary, explicitly triggered repair. Remove after verifying the real schedule.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Reactivate only if no scheduled run exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # An active flag did not produce runs. Try a clean state transition once,
          # with an EXIT trap that restores activation even if diagnostics fail.
          set -euo pipefail
          count=$(gh api "repos/$REPOSITORY/actions/runs?event=schedule&per_page=1" --jq '.total_count')
          echo "Scheduled runs before repair: $count"
          if [ "$count" = 0 ]; then
            trap 'gh api --method PUT "repos/$REPOSITORY/actions/workflows/monitor.yml/enable"' EXIT
            gh api --method PUT "repos/$REPOSITORY/actions/workflows/monitor.yml/disable"
            gh api "repos/$REPOSITORY/actions/workflows/monitor.yml" --jq '{id, state}'
            gh api --method PUT "repos/$REPOSITORY/actions/workflows/monitor.yml/enable"
            trap - EXIT
          fi
          gh api "repos/$REPOSITORY/actions/workflows/monitor.yml" --jq '{id, state, path}'

      - name: Checkout repaired code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify a live positive control without sending an alert
        run: |
          # Change constants only inside this isolated process. This tests the exact
          # parser and confirmation logic against a known alternate configuration.
          # Never invoke main/send_discord, never write state, never change repo files.
          python3 - <<'PY'
          import json
          from unittest.mock import patch
          import monitor
          with patch.object(monitor, 'PRODUCTS', {'MJW84LL/A': '512 GB'}), patch.object(monitor, 'COLOR', 'Black'), patch.object(monitor, 'STORES', {'R148': 'Sherman Oaks'}):
              data = monitor._fetch_json(monitor._pickup_url('R148'))
              candidates = monitor.extract_available(data)
              confirmed = monitor.get_confirmed_inventory(data)
              print('CONTROL ONLY: Black 512 GB. No Discord alert or state change.')
              print(json.dumps({'primary_candidates': len(candidates), 'confirmed': confirmed}))
          PY

      - name: Dispatch one real manual report through the production workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # The monitor reads its existing secret, queries both real Burgundy SKUs,
          # posts a non-pinging report, and logs Discord's returned message receipt.
          set -euo pipefail
          printf '%s' '{"ref":"main","inputs":{"test_webhook":"true"}}' |
            gh api --method POST "repos/$REPOSITORY/actions/workflows/monitor.yml/dispatches" --input -
          echo 'Manual live report requested. This dispatch is NOT proof of cron execution.'
