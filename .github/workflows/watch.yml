name: Manual Cloud Stock Check

# Deliberately manual-only. The Mac TUI now performs the repeating checks.
# Removing cron and push prevents a recovered cloud timer from duplicating alerts.
'on':
  workflow_dispatch:
    inputs:
      test_webhook:
        description: 'Send live Apple inventory to Discord even without stock (no @everyone)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: apple-stock-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Keep the old cloud history separate from the Mac's local state file.
      - name: Restore and save cloud alert state
        if: ${{ !inputs.test_webhook }}
        uses: actions/cache@v6
        with:
          path: .stock-state
          key: stock-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stock-state-

      - name: Check Apple and report to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_WEBHOOK: ${{ inputs.test_webhook }}
        run: python3 monitor.py
