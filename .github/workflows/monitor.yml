name: Apple Stock Monitor

on:
  schedule:
    # Five minutes is GitHub Actions' minimum supported cron interval.
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_webhook:
        description: "Send a clearly labeled Discord test message instead of checking stock"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-stock-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # v7 is the current checkout major and uses the modern Node runtime.
      - name: Checkout
        uses: actions/checkout@v7

      # v6 is the current cache major. Each run gets a unique save key while
      # restore-keys loads the newest prior stock fingerprint for deduplication.
      - name: Restore alert state
        uses: actions/cache@v6
        with:
          path: .stock-state
          key: stock-state-${{ github.run_id }}
          restore-keys: |
            stock-state-

      - name: Check Apple and alert Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TEST_WEBHOOK: ${{ inputs.test_webhook || 'false' }}
        run: python3 monitor.py
