name: Temporary scheduler control
run-name: Scheduler control | ${{ github.event_name }}

# Temporary diagnostic, not a second stock monitor. It sends no notifications,
# does not check Apple, and never changes settings, secrets, or inventory state.
# The same five-minute expression lets us compare native triggers directly.
'on':
  schedule:
    - cron: '2-59/5 * * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/scheduler-check.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the actual trigger
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # A native scheduler success must say schedule, never push or dispatch.
          printf 'Observed event: %s\n' "$EVENT_NAME"
          date -u '+Observed UTC: %Y-%m-%dT%H:%M:%SZ'

      - name: Compare repository and workflow registration
        if: ${{ github.event_name != 'schedule' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # All commands are read-only and print selected public metadata only.
          # No token, repository secret, message content, or private log is printed.
          set -euo pipefail
          echo 'CURRENT REPOSITORY'
          gh api "repos/$REPOSITORY" --jq '{id, default_branch, private, fork, archived, disabled, created_at, pushed_at}'
          echo 'CURRENT REGISTERED WORKFLOWS'
          gh api "repos/$REPOSITORY/actions/workflows" --jq '[.workflows[] | {id, name, path, state, created_at, updated_at}]'
          echo 'CURRENT SCHEDULE HISTORY'
          gh api "repos/$REPOSITORY/actions/runs?event=schedule&per_page=3" --jq '{total_count, runs: [.workflow_runs[] | {id, path, event, status, conclusion, created_at}]}'
          echo 'CURRENT NON-SCHEDULE HISTORY'
          gh api "repos/$REPOSITORY/actions/runs?per_page=10" --jq '[.workflow_runs[] | {id, path, event, status, conclusion, created_at, actor: .actor.login}]'
          echo 'LAST SCHEDULE FILE COMMIT'
          gh api "repos/$REPOSITORY/commits?path=.github/workflows/watch.yml&per_page=1" --jq '[.[] | {sha, author: .author.login, committer: .committer.login, date: .commit.committer.date, message: .commit.message}]'
          echo 'OLDER REPOSITORY WORKFLOW'
          # A failure reading the separate repo is a permission limit, not evidence
          # that its workflow is disabled. Do not change that repository.
          gh api 'repos/Habchy/habchy.github.io/actions/workflows/security-drift-check.yml' --jq '{id, name, path, state, created_at, updated_at}' || echo 'Older workflow metadata not readable with this repository token.'
          echo 'OLDER REPOSITORY SCHEDULE HISTORY'
          gh api 'repos/Habchy/habchy.github.io/actions/runs?event=schedule&per_page=2' --jq '{total_count, runs: [.workflow_runs[] | {id, path, event, status, conclusion, created_at, actor: .actor.login}]}' || echo 'Older schedule history not readable with this repository token.'
